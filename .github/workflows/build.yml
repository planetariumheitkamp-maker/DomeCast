name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish (win-x64, self-contained, single file)
        run: dotnet publish src/DomeCast.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DomeCast-win-x64
          path: publish/
